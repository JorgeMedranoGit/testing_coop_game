<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pantalla Principal</title>
    <!-- Importar SDK de Apinator -->
    <script src="https://unpkg.com/@apinator/client"></script>
    <style>
        body { 
            margin: 0; 
            /* Tu imagen de fondo secreta */
            background: url('fondo_secreto.jpg') no-repeat center center; 
            background-size: cover;
            overflow: hidden; 
        }
        #grid {
            display: grid;
            /* 15 columnas x 10 filas = 150 bloques */
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(10, 1fr);
            height: 100vh;
            width: 100vw;
        }
        .bloque {
            background-color: #111; /* Color sólido tapando el fondo */
            border: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            transition: background-color 0.5s ease;
        }
        .revelado {
            /* Se vuelve semi-transparente para revelar la imagen de fondo pero mantener el nombre legible */
            background-color: rgba(0, 0, 0, 0.4); 
            border: none;
        }
    </style>
</head>
<body>
    <div id="grid"></div>

    <script>
        // 1. Renderizar los 150 bloques en el DOM
        const grid = document.getElementById('grid');
        const bloques = [];
        for (let i = 0; i < 150; i++) {
            const div = document.createElement('div');
            div.className = 'bloque';
            grid.appendChild(div);
            bloques.push(div);
        }

        // 2. Conectar al WebSocket de Apinator
        const apinator = new Apinator('TU_PUBLIC_KEY', { cluster: 'us' });
        
        // Suscribirse al canal global del evento
        const channel = apinator.subscribe('evento-ar-canal');
        
        // 3. Escuchar la señal de los teléfonos
        channel.bind('client-juego-terminado', (data) => {
            // Buscar solo los bloques que aún están cubiertos
            const bloquesDisponibles = bloques.filter(b => !b.classList.contains('revelado'));
            
            if (bloquesDisponibles.length > 0) {
                // Elegir un bloque al azar
                const bloqueAleatorio = bloquesDisponibles[Math.floor(Math.random() * bloquesDisponibles.length)];
                
                // Inyectar el nombre y ejecutar animación CSS
                bloqueAleatorio.textContent = data.nombre;
                bloqueAleatorio.classList.add('revelado');
            }
        });
    </script>
</body>
</html>
