<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pantalla Proyector</title>
    <!-- Importar la librería MQTT para navegadores -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* Tu CSS para el Grid y los bloques va aquí */
        body { background: #000; color: #fff; margin: 0; }
        #grid { display: grid; grid-template-columns: repeat(15, 1fr); height: 100vh; }
        .bloque { border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        .revelado { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="grid"></div>

    <script>
        // 1. Generar los bloques (lógica visual)
        const grid = document.getElementById('grid');
        const bloques = [];
        for (let i = 0; i < 150; i++) {
            const div = document.createElement('div');
            div.className = 'bloque';
            grid.appendChild(div);
            bloques.push(div);
        }

        // 2. Conectar al broker público por WebSockets seguros (wss)
        const cliente = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        
        // Un nombre de canal (tópico) complejo para que nadie más en el broker público interfiera
        const topicoSecreto = 'proyecto_ar_evento_juego_1a2b3c_lpz';

        cliente.on('connect', () => {
            console.log('Pantalla conectada al servidor MQTT');
            cliente.subscribe(topicoSecreto); // Quedarse escuchando
        });

        // 3. Reaccionar a los mensajes que llegan
        cliente.on('message', (topic, mensaje) => {
            // Convertir el mensaje de texto a un objeto JavaScript
            const datos = JSON.parse(mensaje.toString());
            
            if (datos.accion === 'juego_terminado') {
                const bloquesDisponibles = bloques.filter(b => !b.classList.contains('revelado'));
                if (bloquesDisponibles.length > 0) {
                    const bloqueAleatorio = bloquesDisponibles[Math.floor(Math.random() * bloquesDisponibles.length)];
                    bloqueAleatorio.textContent = datos.nombre;
                    bloqueAleatorio.classList.add('revelado');
                }
            }
        });
    </script>
</body>
</html>
