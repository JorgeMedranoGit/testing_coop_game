<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Colectivo | Proyección</title>
    <!-- Catppuccin Design System -->
    <link rel="stylesheet" href="catppuccin.css">
    <!-- MQTT Broker Client -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Procedural Sound Effects -->
    <script src="sound.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ctp-crust);
            /* Imagen secreta de fondo */
            background-image: url('fondo_secreto.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-main);
            color: var(--ctp-text);
            position: relative;
        }

        /* Top HUD Bar */
        .hud-header {
            position: fixed;
            top: 16px;
            left: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 31, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(203, 166, 247, 0.22);
            border-radius: 14px;
            padding: 10px 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
            transition: opacity 0.3s ease;
        }

        .hud-header:hover {
            border-color: rgba(203, 166, 247, 0.45);
        }

        .hud-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-indicator {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--ctp-mauve);
            box-shadow: 0 0 10px var(--ctp-mauve);
            animation: pulseSlow 2s infinite ease-in-out;
        }

        @keyframes pulseSlow {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .hud-title-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--ctp-mauve), var(--ctp-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .hud-title-text p {
            font-size: 0.76rem;
            color: var(--ctp-subtext0);
            letter-spacing: 0.02em;
        }

        /* Progress Bar in HUD */
        .hud-progress-section {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 0 1 440px;
        }

        .hud-progress-bar {
            flex: 1;
            height: 8px;
            background: var(--ctp-surface0);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--ctp-surface1);
            position: relative;
        }

        .hud-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--ctp-mauve), var(--ctp-sapphire), var(--ctp-green));
            box-shadow: 0 0 12px var(--ctp-green);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hud-counter {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--ctp-text);
            min-width: 145px;
            text-align: right;
        }

        .hud-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-btn {
            background: var(--ctp-surface0);
            border: 1px solid var(--ctp-surface2);
            color: var(--ctp-text);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .hud-btn svg {
            width: 15px;
            height: 15px;
        }

        .hud-btn:hover {
            background: var(--ctp-surface1);
            border-color: var(--ctp-mauve);
            color: var(--ctp-mauve);
        }

        /* Dynamic Grid Layout (Full Viewport Flex) */
        #grid {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            overflow: hidden;
            transition: all 0.8s ease;
        }

        .grid-fila {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .bloque {
            flex: 1;
            min-width: 0;
            height: 100%;
            /* Estado no revelado: superficie oscura elegante */
            background-color: #12121c;
            border: 1px solid rgba(69, 71, 90, 0.38);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            color: var(--ctp-subtext0);
            font-family: var(--font-main);
            position: relative;
            cursor: default;
            user-select: none;
            overflow: hidden;
            transition: background-color 0.6s ease, border-color 0.4s ease, opacity 0.8s ease, transform 0.4s ease;
        }

        .bloque::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(49, 50, 68, 0.25) 0%, transparent 70%);
            pointer-events: none;
        }

        .bloque .bloque-num {
            font-family: var(--font-mono);
            font-size: clamp(0.72rem, 1.2vw, 1rem);
            color: rgba(147, 153, 178, 0.45);
            font-weight: 600;
            letter-spacing: 0.06em;
            background: rgba(30, 30, 46, 0.4);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(69, 71, 90, 0.25);
        }

        /* Estado Revelado: se vuelve traslúcido para revelar el fondo secreto */
        .bloque.revelado {
            background-color: rgba(17, 17, 27, 0.28);
            backdrop-filter: blur(0.5px);
            -webkit-backdrop-filter: blur(0.5px);
            border: 1px solid rgba(203, 166, 247, 0.35);
            animation: revealPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .bloque.revelado:hover {
            background-color: rgba(17, 17, 27, 0.08);
            border-color: var(--ctp-mauve);
        }

        .bloque-avatar-badge {
            width: clamp(38px, 4.5vw, 60px);
            height: clamp(38px, 4.5vw, 60px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.95rem, 1.6vw, 1.4rem);
            font-weight: 800;
            color: #11111b;
            margin-bottom: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65);
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        .bloque.revelado .bloque-nombre {
            color: #ffffff;
            font-size: clamp(0.85rem, 1.4vw, 1.25rem);
            font-weight: 800;
            text-align: center;
            max-width: 95%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.02em;
        }

        @keyframes revealPop {
            0% {
                transform: scale(0.6) rotate(-2deg);
                box-shadow: 0 0 35px var(--ctp-mauve);
                border-color: var(--ctp-mauve);
                z-index: 20;
            }
            60% {
                transform: scale(1.04) rotate(1deg);
                box-shadow: 0 0 20px var(--ctp-sapphire);
                z-index: 20;
            }
            100% {
                transform: scale(1) rotate(0deg);
                box-shadow: none;
                z-index: 1;
            }
        }

        /* Recent Player Toast */
        .toast-feed {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            pointer-events: none;
            max-width: 380px;
        }

        .toast-item {
            background: rgba(30, 30, 46, 0.92);
            backdrop-filter: blur(12px);
            border-left: 3px solid var(--ctp-green);
            border-top: 1px solid var(--ctp-surface2);
            border-right: 1px solid var(--ctp-surface2);
            border-bottom: 1px solid var(--ctp-surface2);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            animation: slideInToast 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .toast-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 800;
            color: #11111b;
            flex-shrink: 0;
        }

        @keyframes slideInToast {
            0% { transform: translateX(80px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* Grand Finale Modal */
        #finaleBanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 17, 27, 0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            animation: popScale 0.6s ease;
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 250;
        }

        /* Grid Completed: todo el mosaico se vuelve transparente para ver la foto 100% limpia */
        .grid-completed .bloque {
            border: none;
            background-color: transparent !important;
            backdrop-filter: none !important;
        }
        .grid-completed .bloque .bloque-num {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Top HUD Navigation Bar -->
    <div class="hud-header" id="hudHeader">
        <div class="hud-title">
            <div class="hud-indicator"></div>
            <div class="hud-title-text">
                <h1>Mural Colectivo</h1>
                <p id="modoCuadriculaTxt">Proyección colaborativa en vivo</p>
            </div>
        </div>

        <div class="hud-progress-section">
            <div class="hud-progress-bar">
                <div class="hud-progress-fill" id="progressFill"></div>
            </div>
            <div class="hud-counter">
                <span id="revealedCount" style="color: var(--ctp-mauve);">0</span> / <span id="totalCount">1</span> (<span id="percentage">0%</span>)
            </div>
        </div>

        <div class="hud-actions">
            <div class="ctp-badge ctp-badge-mauve" id="playerCountBadge">
                <span id="playerCount">0</span> Participantes
            </div>
            <div id="connStatus" class="ctp-badge ctp-badge-yellow">
                <span class="status-dot connecting" id="statusDot"></span>
                <span id="statusText">Conectando</span>
            </div>
            <button class="hud-btn" onclick="toggleFullscreen()" title="Pantalla completa">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <span>F11</span>
            </button>
            <button class="hud-btn" id="audioBtn" onclick="toggleAudio()" title="Alternar sonido">
                <svg id="audioIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Contenedor dinámico de la cuadrícula -->
    <div id="grid"></div>

    <!-- Toast Feed for live player arrivals -->
    <div class="toast-feed" id="toastFeed"></div>

    <!-- Grand Finale Banner -->
    <div id="finaleBanner">
        <div class="ctp-card" style="text-align: center; max-width: 580px; padding: 36px; border: 1.5px solid var(--ctp-green); box-shadow: 0 0 50px rgba(166, 227, 161, 0.35);">
            <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(166, 227, 161, 0.15); border: 2px solid var(--ctp-green); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; color: var(--ctp-green);">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h1 style="font-size: 2rem; font-weight: 900; color: var(--ctp-green); margin-bottom: 8px;">
                Mural Completado
            </h1>
            <p style="font-size: 1.05rem; color: var(--ctp-subtext0); margin-bottom: 24px; line-height: 1.5;">
                Todos los participantes han descubierto su fragmento de la imagen.
            </p>
            <button class="ctp-btn ctp-btn-green" onclick="cerrarBanner()">
                Apreciar imagen completa
            </button>
        </div>
    </div>

    <script>
        // Estado de la pantalla
        let totalBloques = 1;
        let bloques = [];
        let revelados = 0;
        let jugadoresConectados = new Map(); // id -> { id, nombre, color }
        let juegoEnCurso = false;
        let audioActivo = true;

        function obtenerIniciales(texto) {
            if (!texto) return 'P';
            const partes = texto.trim().split(/\s+/);
            if (partes.length === 1) {
                return partes[0].substring(0, 2).toUpperCase();
            }
            return (partes[0][0] + partes[1][0]).toUpperCase();
        }

        // 1. Distribución 1:1 exacta para N bloques
        function calcularDistribucion(N) {
            const total = Math.max(N, 1);
            if (total === 1) return { total: 1, rows: 1, filas: [1] };
            if (total === 2) return { total: 2, rows: 1, filas: [2] };
            if (total === 3) return { total: 3, rows: 1, filas: [3] };

            let rows = Math.round(Math.sqrt(total / 1.77));
            if (rows < 1) rows = 1;
            if (rows > total) rows = total;

            const baseCols = Math.floor(total / rows);
            const remainder = total % rows;
            const filas = [];
            for (let r = 0; r < rows; r++) {
                filas.push(baseCols + (r < remainder ? 1 : 0));
            }
            return { total, rows, filas };
        }

        // 2. Reconstruir la cuadrícula dinámica en el DOM
        function reconstruirCuadricula(cantidad) {
            totalBloques = Math.max(cantidad, 1);
            bloques = [];
            revelados = 0;
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const dist = calcularDistribucion(totalBloques);
            let idx = 1;

            for (let r = 0; r < dist.rows; r++) {
                const filaDiv = document.createElement('div');
                filaDiv.className = 'grid-fila';

                const cols = dist.filas[r];
                for (let c = 0; c < cols; c++) {
                    const div = document.createElement('div');
                    div.className = 'bloque';
                    div.dataset.index = idx - 1;

                    const numSpan = document.createElement('span');
                    numSpan.className = 'bloque-num';
                    numSpan.textContent = String(idx).padStart(2, '0');
                    div.appendChild(numSpan);

                    filaDiv.appendChild(div);
                    bloques.push(div);
                    idx++;
                }
                grid.appendChild(filaDiv);
            }

            actualizarHUD();
        }

        // Inicializar cuadrícula base con 1 bloque
        reconstruirCuadricula(totalBloques);

        // 3. Conectar al broker MQTT
        const topicoSecreto = 'proyecto_ar_evento_juego_1a2b3c_lpz';
        const cliente = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            keepalive: 60,
            reconnectPeriod: 2000,
            clean: true
        });

        cliente.on('connect', () => {
            setConnectionStatus('online', 'En línea');
            cliente.subscribe(topicoSecreto, (err) => {
                if (!err) {
                    cliente.publish(topicoSecreto, JSON.stringify({ accion: 'ping_jugadores' }));
                }
            });
        });

        cliente.on('reconnect', () => setConnectionStatus('connecting', 'Reconectando'));
        cliente.on('offline', () => setConnectionStatus('offline', 'Sin conexión'));
        cliente.on('error', () => setConnectionStatus('offline', 'Error'));

        function setConnectionStatus(state, label) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const connStatus = document.getElementById('connStatus');

            statusDot.className = 'status-dot ' + state;
            statusText.textContent = label;

            connStatus.className = 'ctp-badge ' + (
                state === 'online' ? 'ctp-badge-green' :
                state === 'connecting' ? 'ctp-badge-yellow' : 'ctp-badge-red'
            );
        }

        // 4. Reaccionar a mensajes MQTT
        cliente.on('message', (topic, mensaje) => {
            try {
                const datos = JSON.parse(mensaje.toString());

                if (datos.accion === 'jugador_unido') {
                    const pId = datos.id || datos.nombre;
                    const esNuevo = !jugadoresConectados.has(pId);
                    jugadoresConectados.set(pId, {
                        id: pId,
                        nombre: datos.nombre,
                        color: datos.color || '#cba6f7'
                    });

                    document.getElementById('playerCount').textContent = jugadoresConectados.size;

                    if (esNuevo) {
                        mostrarToast(datos.color || '#cba6f7', obtenerIniciales(datos.nombre), `${datos.nombre} se ha unido a la sala`);
                        if (!juegoEnCurso) {
                            reconstruirCuadricula(Math.max(jugadoresConectados.size, 1));
                        }
                    }
                } else if (datos.accion === 'jugador_desconectado') {
                    if (jugadoresConectados.has(datos.id)) {
                        const j = jugadoresConectados.get(datos.id);
                        jugadoresConectados.delete(datos.id);
                        document.getElementById('playerCount').textContent = jugadoresConectados.size;
                        mostrarToast(j.color || '#fab387', obtenerIniciales(j.nombre), `${j.nombre} se ha retirado`);
                        if (!juegoEnCurso) {
                            reconstruirCuadricula(Math.max(jugadoresConectados.size, 1));
                        }
                    }
                } else if (datos.accion === 'desconectar_todos') {
                    jugadoresConectados.clear();
                    juegoEnCurso = false;
                    revelados = 0;
                    document.getElementById('playerCount').textContent = '0';
                    reconstruirCuadricula(1);
                    document.getElementById('grid').classList.remove('grid-completed');
                    document.getElementById('finaleBanner').style.display = 'none';
                    mostrarToast('#fab387', '·', 'Todos los participantes han sido desconectados');
                } else if (datos.accion === 'iniciar_juego') {
                    juegoEnCurso = true;
                    const cantFinal = datos.totalJugadores || Math.max(jugadoresConectados.size, 1);
                    reconstruirCuadricula(cantFinal);
                    document.getElementById('grid').classList.remove('grid-completed');
                    document.getElementById('finaleBanner').style.display = 'none';

                    mostrarToast('#a6e3a1', 'OK', `Ronda iniciada con ${cantFinal} bloque${cantFinal > 1 ? 's' : ''}`);
                    sound.playStart();
                } else if (datos.accion === 'juego_terminado') {
                    revelarBloque(datos.nombre, datos.color, datos.tiempo);
                } else if (datos.accion === 'reiniciar_juego') {
                    reiniciarPantalla();
                } else if (datos.accion === 'revelar_todo') {
                    revelarTodosLosBloques();
                }
            } catch (e) {
                console.error('Error procesando mensaje:', e);
            }
        });

        // 5. Lógica de revelación de un bloque
        function revelarBloque(nombre, color = '#cba6f7', tiempo = null) {
            const disponibles = bloques.filter(b => !b.classList.contains('revelado'));
            if (disponibles.length === 0) return;

            const bloque = disponibles[Math.floor(Math.random() * disponibles.length)];
            bloque.innerHTML = '';

            const badge = document.createElement('div');
            badge.className = 'bloque-avatar-badge';
            badge.style.background = color || '#cba6f7';
            badge.textContent = obtenerIniciales(nombre);

            const nombreSpan = document.createElement('div');
            nombreSpan.className = 'bloque-nombre';
            nombreSpan.textContent = nombre;

            bloque.appendChild(badge);
            bloque.appendChild(nombreSpan);
            bloque.classList.add('revelado');

            revelados++;
            actualizarHUD();

            sound.playReveal();

            const txtTiempo = tiempo ? ` en ${tiempo}s` : '';
            mostrarToast(color || '#cba6f7', obtenerIniciales(nombre), `<strong>${nombre}</strong> completó su bloque${txtTiempo}`);

            if (revelados >= totalBloques) {
                dispararGranFinal();
            }
        }

        // 6. Actualizar barra de progreso y contador
        function actualizarHUD() {
            const pct = Math.min(100, Math.round((revelados / totalBloques) * 100));
            document.getElementById('revealedCount').textContent = revelados;
            document.getElementById('totalCount').textContent = totalBloques;
            document.getElementById('percentage').textContent = pct + '%';
            document.getElementById('progressFill').style.width = pct + '%';
        }

        // 7. Revelar todos los bloques en cascada
        function revelarTodosLosBloques() {
            const disponibles = bloques.filter(b => !b.classList.contains('revelado'));
            if (disponibles.length === 0) return;

            let delay = 0;
            const colores = ['#cba6f7', '#74c7ec', '#a6e3a1', '#fab387', '#f5c2e7', '#b4befe'];
            const nombres = ['Comunidad', 'Equipo', 'Diseño', 'Sistemas', 'Participante', 'Colaborador'];

            disponibles.forEach((bloque) => {
                setTimeout(() => {
                    if (!bloque.classList.contains('revelado')) {
                        const rColor = colores[Math.floor(Math.random() * colores.length)];
                        const rNombre = nombres[Math.floor(Math.random() * nombres.length)];

                        bloque.innerHTML = `
                            <div class="bloque-avatar-badge" style="background: ${rColor}">${obtenerIniciales(rNombre)}</div>
                            <div class="bloque-nombre">${rNombre}</div>
                        `;
                        bloque.classList.add('revelado');
                        revelados++;
                        actualizarHUD();
                        sound.playReveal();

                        if (revelados >= totalBloques) {
                            dispararGranFinal();
                        }
                    }
                }, delay);
                delay += 30;
            });
        }

        // 8. Reiniciar estado de la pantalla
        function reiniciarPantalla() {
            juegoEnCurso = false;
            revelados = 0;
            document.getElementById('grid').classList.remove('grid-completed');
            document.getElementById('finaleBanner').style.display = 'none';

            jugadoresConectados.clear();
            document.getElementById('playerCount').textContent = '0';

            cliente.publish(topicoSecreto, JSON.stringify({ accion: 'ping_jugadores' }));

            setTimeout(() => {
                const cant = Math.max(jugadoresConectados.size, 1);
                reconstruirCuadricula(cant);
            }, 400);

            mostrarToast('#74c7ec', '·', 'Mural reiniciado. Re-verificando participantes...');
        }

        // 9. Gran final
        function dispararGranFinal() {
            sound.playVictory();
            lanzarConfetti();
            document.getElementById('grid').classList.add('grid-completed');
            document.getElementById('finaleBanner').style.display = 'flex';
        }

        function cerrarBanner() {
            document.getElementById('finaleBanner').style.display = 'none';
        }

        // 10. Toast notification
        function mostrarToast(color, iniciales, textoHtml) {
            const toastFeed = document.getElementById('toastFeed');
            const toast = document.createElement('div');
            toast.className = 'toast-item';
            toast.innerHTML = `
                <div class="toast-badge" style="background: ${color}">${iniciales}</div>
                <div style="font-size: 0.88rem; color: var(--ctp-text); line-height: 1.4;">${textoHtml}</div>
            `;

            toastFeed.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // 11. Pantalla completa y audio
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Error solicitando pantalla completa:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function toggleAudio() {
            audioActivo = sound.toggle();
            const icon = document.getElementById('audioIcon');
            if (audioActivo) {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            } else {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
            }
        }

        // 12. Confetti Canvas
        function lanzarConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#cba6f7', '#a6e3a1', '#fab387', '#74c7ec', '#f5c2e7', '#f9e2af', '#89b4fa'];

            for (let i = 0; i < 180; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20 - Math.random() * 50,
                    vx: (Math.random() - 0.5) * 6,
                    vy: Math.random() * 4 + 3,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }

            let animId;
            let frames = 0;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                frames++;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.rotSpeed;

                    if (frames > 200) p.alpha -= 0.008;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (frames < 360) {
                    animId = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animId);
                }
            }

            render();
        }
    </script>
</body>
