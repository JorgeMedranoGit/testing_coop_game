<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Proyector | Revela el Secreto</title>
    <!-- Catppuccin Design System -->
    <link rel="stylesheet" href="catppuccin.css">
    <!-- MQTT Broker Client -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Procedural Sound Effects -->
    <script src="sound.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ctp-crust);
            /* Imagen secreta de fondo */
            background-image: url('fondo_secreto.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-main);
            color: var(--ctp-text);
            position: relative;
        }

        /* Top HUD Bar */
        .hud-header {
            position: fixed;
            top: 14px;
            left: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(24, 24, 37, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(203, 166, 247, 0.25);
            border-radius: 16px;
            padding: 10px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: opacity 0.3s ease;
        }

        .hud-header:hover {
            border-color: rgba(203, 166, 247, 0.5);
        }

        .hud-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-title-icon {
            font-size: 1.8rem;
            animation: pulse 2s infinite;
        }

        .hud-title-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--ctp-mauve), var(--ctp-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .hud-title-text p {
            font-size: 0.8rem;
            color: var(--ctp-subtext0);
        }

        /* Progress Bar in HUD */
        .hud-progress-section {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 0 1 450px;
        }

        .hud-progress-bar {
            flex: 1;
            height: 12px;
            background: var(--ctp-surface0);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--ctp-surface1);
            position: relative;
        }

        .hud-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--ctp-mauve), var(--ctp-sapphire), var(--ctp-green));
            box-shadow: 0 0 14px var(--ctp-green);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hud-counter {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 1rem;
            color: var(--ctp-text);
            min-width: 140px;
            text-align: right;
        }

        .hud-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-btn {
            background: var(--ctp-surface0);
            border: 1px solid var(--ctp-surface2);
            color: var(--ctp-text);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: var(--ctp-surface1);
            border-color: var(--ctp-mauve);
            color: var(--ctp-mauve);
        }

        /* Dynamic Grid Layout (Flex Rows & Columns) */
        #grid {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            overflow: hidden;
        }

        .grid-fila {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .bloque {
            flex: 1;
            min-width: 0;
            height: 100%;
            /* Estado no revelado: tapa completamente la imagen */
            background-color: #181825; /* Catppuccin Mantle */
            border: 1px solid rgba(69, 71, 90, 0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            color: var(--ctp-subtext0);
            font-family: var(--font-main);
            font-size: 0.9rem;
            position: relative;
            cursor: default;
            user-select: none;
            overflow: hidden;
            transition: background-color 0.6s ease, border-color 0.4s ease, opacity 0.8s ease, transform 0.4s ease;
        }

        /* Micro texture on unrevealed blocks */
        .bloque::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(49, 50, 68, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        .bloque .bloque-num {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: rgba(108, 112, 134, 0.5);
            font-weight: 600;
        }

        /* Estado Revelado: se vuelve traslúcido para revelar el fondo secreto */
        .bloque.revelado {
            background-color: rgba(24, 24, 37, 0.28);
            backdrop-filter: blur(0.5px);
            -webkit-backdrop-filter: blur(0.5px);
            border: 1px solid rgba(203, 166, 247, 0.35);
            animation: revealPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .bloque.revelado:hover {
            background-color: rgba(24, 24, 37, 0.08);
            border-color: var(--ctp-mauve);
        }

        .bloque.revelado .bloque-avatar {
            font-size: 1.7rem;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.9));
            margin-bottom: 2px;
        }

        .bloque.revelado .bloque-nombre {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            text-align: center;
            max-width: 95%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.02em;
        }

        @keyframes revealPop {
            0% {
                transform: scale(0.6) rotate(-4deg);
                box-shadow: 0 0 40px var(--ctp-mauve);
                border-color: var(--ctp-mauve);
                z-index: 20;
            }
            60% {
                transform: scale(1.08) rotate(1deg);
                box-shadow: 0 0 25px var(--ctp-sapphire);
                z-index: 20;
            }
            100% {
                transform: scale(1) rotate(0deg);
                box-shadow: none;
                z-index: 1;
            }
        }

        /* Recent Player Toast */
        .toast-feed {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            pointer-events: none;
            max-width: 380px;
        }

        .toast-item {
            background: rgba(30, 30, 46, 0.92);
            backdrop-filter: blur(12px);
            border-left: 4px solid var(--ctp-green);
            border-top: 1px solid var(--ctp-surface2);
            border-right: 1px solid var(--ctp-surface2);
            border-bottom: 1px solid var(--ctp-surface2);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            animation: slideInToast 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideInToast {
            0% { transform: translateX(80px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* Grand Finale Modal */
        #finaleBanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 17, 27, 0.65);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            animation: popScale 0.6s ease;
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 250;
        }

        /* Hide grid completely when victory ceremony triggered */
        .grid-completed .bloque {
            border: none;
            background-color: transparent !important;
            backdrop-filter: none !important;
        }
        .grid-completed .bloque .bloque-num {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Top HUD Navigation Bar -->
    <div class="hud-header" id="hudHeader">
        <div class="hud-title">
            <div class="hud-title-icon">✨</div>
            <div class="hud-title-text">
                <h1>Mural Cooperativo</h1>
                <p id="modoCuadriculaTxt">Cuadrícula Adaptativa (1 bloque por jugador)</p>
            </div>
        </div>

        <div class="hud-progress-section">
            <div class="hud-progress-bar">
                <div class="hud-progress-fill" id="progressFill"></div>
            </div>
            <div class="hud-counter">
                <span id="revealedCount" style="color: var(--ctp-mauve);">0</span> / <span id="totalCount">6</span> (<span id="percentage">0%</span>)
            </div>
        </div>

        <div class="hud-actions">
            <div class="ctp-badge ctp-badge-mauve" id="playerCountBadge">
                👥 <span id="playerCount">0</span> Jugadores
            </div>
            <div id="connStatus" class="ctp-badge ctp-badge-yellow">
                <span class="status-dot connecting" id="statusDot"></span>
                <span id="statusText">Conectando...</span>
            </div>
            <button class="hud-btn" onclick="toggleFullscreen()" title="Pantalla Completa">
                ⛶ <span style="font-size: 0.8rem;">F11</span>
            </button>
            <button class="hud-btn" id="audioBtn" onclick="toggleAudio()" title="Alternar Sonido">
                🔊
            </button>
        </div>
    </div>

    <!-- Contenedor dinámico de la cuadrícula -->
    <div id="grid"></div>

    <!-- Toast Feed for live player arrivals -->
    <div class="toast-feed" id="toastFeed"></div>

    <!-- Grand Finale Banner -->
    <div id="finaleBanner">
        <div class="ctp-card" style="text-align: center; max-width: 600px; padding: 40px; border: 2px solid var(--ctp-green); box-shadow: 0 0 50px rgba(166, 227, 161, 0.4);">
            <div style="font-size: 4rem; margin-bottom: 12px; animation: pulse 1s infinite;">🎉</div>
            <h1 style="font-size: 2.4rem; font-weight: 900; color: var(--ctp-green); margin-bottom: 10px;">
                ¡MURAL COMPLETADO!
            </h1>
            <p style="font-size: 1.2rem; color: var(--ctp-subtext0); margin-bottom: 24px;">
                ¡Todos los jugadores han desbloqueado su parte del secreto!
            </p>
            <button class="ctp-btn ctp-btn-green" onclick="cerrarBanner()">
                Ver Imagen Completa ✨
            </button>
        </div>
    </div>

    <script>
        // Estado de la pantalla
        let totalBloques = 1; // 1 jugador = 1 bloque exacto
        let bloques = [];
        let revelados = 0;
        let jugadoresConectados = new Map(); // id -> { id, nombre, avatar }
        let juegoEnCurso = false;
        let audioActivo = true;

        // 1. Algoritmo para calcular distribución de filas y columnas exactamente para N bloques
        function calcularDistribucion(N) {
            const total = Math.max(N, 1);
            if (total === 1) {
                return { total: 1, rows: 1, filas: [1] }; // 1 jugador = 1 bloque en pantalla completa
            }
            if (total === 2) {
                return { total: 2, rows: 1, filas: [2] }; // 2 jugadores = 2 bloques (50% cada uno)
            }
            if (total === 3) {
                return { total: 3, rows: 1, filas: [3] }; // 3 jugadores = 3 bloques (33% cada uno)
            }

            let rows = Math.round(Math.sqrt(total / 1.77));
            if (rows < 1) rows = 1;
            if (rows > total) rows = total;

            const baseCols = Math.floor(total / rows);
            const remainder = total % rows;
            const filas = [];
            for (let r = 0; r < rows; r++) {
                filas.push(baseCols + (r < remainder ? 1 : 0));
            }
            return { total, rows, filas };
        }

        // 2. Reconstruir la cuadrícula dinámica en el DOM
        function reconstruirCuadricula(cantidad) {
            totalBloques = Math.max(cantidad, 1);
            bloques = [];
            revelados = 0;
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const dist = calcularDistribucion(totalBloques);
            let idx = 1;

            for (let r = 0; r < dist.rows; r++) {
                const filaDiv = document.createElement('div');
                filaDiv.className = 'grid-fila';

                const cols = dist.filas[r];
                for (let c = 0; c < cols; c++) {
                    const div = document.createElement('div');
                    div.className = 'bloque';
                    div.dataset.index = idx - 1;

                    const numSpan = document.createElement('span');
                    numSpan.className = 'bloque-num';
                    numSpan.textContent = '#' + idx;
                    div.appendChild(numSpan);

                    filaDiv.appendChild(div);
                    bloques.push(div);
                    idx++;
                }
                grid.appendChild(filaDiv);
            }

            actualizarHUD();
        }

        // Inicializar cuadrícula base con 1 bloque
        reconstruirCuadricula(totalBloques);

        // 3. Conectar al broker MQTT
        const topicoSecreto = 'proyecto_ar_evento_juego_1a2b3c_lpz';
        const cliente = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            keepalive: 60,
            reconnectPeriod: 2000,
            clean: true
        });

        cliente.on('connect', () => {
            console.log('Pantalla conectada al servidor MQTT');
            setConnectionStatus('online', 'En Línea');
            cliente.subscribe(topicoSecreto, (err) => {
                if (err) {
                    console.error('Error suscribiendo al tópico:', err);
                } else {
                    // Solicitar a todos los teléfonos activos que anuncien su presencia
                    cliente.publish(topicoSecreto, JSON.stringify({ accion: 'ping_jugadores' }));
                }
            });
        });

        cliente.on('reconnect', () => {
            setConnectionStatus('connecting', 'Reconectando...');
        });

        cliente.on('offline', () => {
            setConnectionStatus('offline', 'Desconectado');
        });

        cliente.on('error', (err) => {
            console.error('Error MQTT:', err);
            setConnectionStatus('offline', 'Error');
        });

        function setConnectionStatus(state, label) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const connStatus = document.getElementById('connStatus');

            statusDot.className = 'status-dot ' + state;
            statusText.textContent = label;

            connStatus.className = 'ctp-badge ' + (
                state === 'online' ? 'ctp-badge-green' :
                state === 'connecting' ? 'ctp-badge-yellow' : 'ctp-badge-red'
            );
        }

        // 4. Reaccionar a mensajes MQTT
        cliente.on('message', (topic, mensaje) => {
            try {
                const datos = JSON.parse(mensaje.toString());

                if (datos.accion === 'jugador_unido') {
                    const pId = datos.id || (datos.nombre + '_' + (datos.avatar || ''));
                    const esNuevo = !jugadoresConectados.has(pId);
                    jugadoresConectados.set(pId, {
                        id: pId,
                        nombre: datos.nombre,
                        avatar: datos.avatar || '🚀'
                    });

                    document.getElementById('playerCount').textContent = jugadoresConectados.size;

                    if (esNuevo) {
                        mostrarToast(datos.avatar || '👤', `¡${datos.nombre} se unió! (${jugadoresConectados.size} en sala)`);
                        // Si el juego todavía está en lobby/espera, adaptar cuadrícula exacta al número de jugadores
                        if (!juegoEnCurso) {
                            reconstruirCuadricula(Math.max(jugadoresConectados.size, 1));
                        }
                    }
                } else if (datos.accion === 'jugador_desconectado') {
                    if (jugadoresConectados.has(datos.id)) {
                        const j = jugadoresConectados.get(datos.id);
                        jugadoresConectados.delete(datos.id);
                        document.getElementById('playerCount').textContent = jugadoresConectados.size;
                        mostrarToast(j.avatar || '👋', `${j.nombre} se ha desconectado`);
                        if (!juegoEnCurso) {
                            reconstruirCuadricula(Math.max(jugadoresConectados.size, 1));
                        }
                    }
                } else if (datos.accion === 'desconectar_todos') {
                    jugadoresConectados.clear();
                    juegoEnCurso = false;
                    revelados = 0;
                    document.getElementById('playerCount').textContent = '0';
                    reconstruirCuadricula(1);
                    document.getElementById('grid').classList.remove('grid-completed');
                    document.getElementById('finaleBanner').style.display = 'none';
                    mostrarToast('🚪', 'Todos los jugadores han sido desconectados.');
                } else if (datos.accion === 'iniciar_juego') {
                    juegoEnCurso = true;
                    // Fijar cuadrícula al número exacto de jugadores registrados
                    const cantFinal = datos.totalJugadores || Math.max(jugadoresConectados.size, 1);
                    reconstruirCuadricula(cantFinal);
                    document.getElementById('grid').classList.remove('grid-completed');
                    document.getElementById('finaleBanner').style.display = 'none';

                    mostrarToast('🚀', `¡Partida iniciada! Cuadrícula de ${cantFinal} bloque${cantFinal > 1 ? 's' : ''}.`);
                    sound.playStart();
                } else if (datos.accion === 'juego_terminado') {
                    revelarBloque(datos.nombre, datos.avatar, datos.tiempo);
                } else if (datos.accion === 'reiniciar_juego') {
                    reiniciarPantalla();
                } else if (datos.accion === 'revelar_todo') {
                    revelarTodosLosBloques();
                }
            } catch (e) {
                console.error('Error procesando mensaje:', e);
            }
        });

        // 5. Lógica de revelación de un bloque
        function revelarBloque(nombre, avatar = '🚀', tiempo = null) {
            const disponibles = bloques.filter(b => !b.classList.contains('revelado'));
            if (disponibles.length === 0) return;

            // Elegir un bloque aleatorio aún cubierto
            const bloque = disponibles[Math.floor(Math.random() * disponibles.length)];
            bloque.innerHTML = ''; // Limpiar número

            const avatarSpan = document.createElement('div');
            avatarSpan.className = 'bloque-avatar';
            avatarSpan.textContent = avatar;

            const nombreSpan = document.createElement('div');
            nombreSpan.className = 'bloque-nombre';
            nombreSpan.textContent = nombre;

            bloque.appendChild(avatarSpan);
            bloque.appendChild(nombreSpan);
            bloque.classList.add('revelado');

            revelados++;
            actualizarHUD();

            // Sonido de revelación
            sound.playReveal();

            // Toast feed
            const txtTiempo = tiempo ? ` en ${tiempo}s` : '';
            mostrarToast(avatar, `<strong>${nombre}</strong> reveló su bloque${txtTiempo}!`);

            // Verificar si se completaron todos los bloques de la cuadrícula
            if (revelados >= totalBloques) {
                dispararGranFinal();
            }
        }

        // 6. Actualizar barra de progreso y contador
        function actualizarHUD() {
            const pct = Math.min(100, Math.round((revelados / totalBloques) * 100));
            document.getElementById('revealedCount').textContent = revelados;
            document.getElementById('totalCount').textContent = totalBloques;
            document.getElementById('percentage').textContent = pct + '%';
            document.getElementById('progressFill').style.width = pct + '%';
        }

        // 7. Revelar todos los bloques en cascada
        function revelarTodosLosBloques() {
            const disponibles = bloques.filter(b => !b.classList.contains('revelado'));
            if (disponibles.length === 0) return;

            let delay = 0;
            const avatars = ['🌟', '🚀', '⚡', '💎', '🔥', '🦊', '🐱', '🎮'];
            const nombres = ['Comunidad', 'Equipo', 'Gamer', 'Master', 'Player', 'VIP', 'Heroe'];

            disponibles.forEach((bloque) => {
                setTimeout(() => {
                    if (!bloque.classList.contains('revelado')) {
                        const rAvatar = avatars[Math.floor(Math.random() * avatars.length)];
                        const rNombre = nombres[Math.floor(Math.random() * nombres.length)];
                        bloque.innerHTML = `
                            <div class="bloque-avatar">${rAvatar}</div>
                            <div class="bloque-nombre">${rNombre}</div>
                        `;
                        bloque.classList.add('revelado');
                        revelados++;
                        actualizarHUD();
                        sound.playReveal();

                        if (revelados >= totalBloques) {
                            dispararGranFinal();
                        }
                    }
                }, delay);
                delay += 30; // Cascada rápida
            });
        }

        // 8. Reiniciar estado de la pantalla
        function reiniciarPantalla() {
            juegoEnCurso = false;
            revelados = 0;
            document.getElementById('grid').classList.remove('grid-completed');
            document.getElementById('finaleBanner').style.display = 'none';

            // Limpiamos la lista para volver a verificar quién está REALMENTE en línea
            jugadoresConectados.clear();
            document.getElementById('playerCount').textContent = '0';

            // Pedir a los teléfonos activos que respondan
            cliente.publish(topicoSecreto, JSON.stringify({ accion: 'ping_jugadores' }));

            // Reajustar cuadrícula a los jugadores que realmente respondan
            setTimeout(() => {
                const cant = Math.max(jugadoresConectados.size, 1);
                reconstruirCuadricula(cant);
            }, 400);

            mostrarToast('🔄', 'El juego ha sido reiniciado. Comprobando jugadores en línea...');
        }

        // 9. Gran final
        function dispararGranFinal() {
            sound.playVictory();
            lanzarConfetti();
            document.getElementById('grid').classList.add('grid-completed');
            document.getElementById('finaleBanner').style.display = 'flex';
        }

        function cerrarBanner() {
            document.getElementById('finaleBanner').style.display = 'none';
        }

        // 10. Toast notification
        function mostrarToast(avatar, textoHtml) {
            const toastFeed = document.getElementById('toastFeed');
            const toast = document.createElement('div');
            toast.className = 'toast-item';
            toast.innerHTML = `
                <div style="font-size: 1.6rem;">${avatar}</div>
                <div style="font-size: 0.92rem; color: var(--ctp-text);">${textoHtml}</div>
            `;

            toastFeed.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 400);
            }, 4500);
        }

        // 11. Pantalla completa y audio
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Error solicitando pantalla completa:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function toggleAudio() {
            audioActivo = sound.toggle();
            const btn = document.getElementById('audioBtn');
            btn.textContent = audioActivo ? '🔊' : '🔇';
            btn.style.opacity = audioActivo ? '1' : '0.6';
        }

        // 12. Confetti Canvas
        function lanzarConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#cba6f7', '#a6e3a1', '#fab387', '#74c7ec', '#f5c2e7', '#f9e2af', '#89b4fa'];

            for (let i = 0; i < 180; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20 - Math.random() * 50,
                    vx: (Math.random() - 0.5) * 6,
                    vy: Math.random() * 4 + 3,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }

            let animId;
            let frames = 0;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                frames++;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.rotSpeed;

                    if (frames > 200) p.alpha -= 0.008;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (frames < 360) {
                    animId = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animId);
                }
            }

            render();
        }
    </script>
</body>
