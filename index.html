<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Tu CSS iría aquí -->
</head>
<body>
    <div id="registro">
        <input type="text" id="nombre" placeholder="Tu Nombre">
        <button onclick="registrarse()">Entrar</button>
    </div>
    
    <div id="espera" style="display:none;">Esperando al administrador...</div>
    
    <div id="juego" style="display:none;">Taps restantes: <span id="contador">15</span></div>

    <script>
        let nombreUsuario = '';
        let tapsRestantes = 15;
        const cliente = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topicoSecreto = 'proyecto_ar_evento_juego_1a2b3c_lpz';

        function registrarse() {
            nombreUsuario = document.getElementById('nombre').value;
            if(!nombreUsuario) return;
            
            document.getElementById('registro').style.display = 'none';
            document.getElementById('espera').style.display = 'block';

            // Escuchar al administrador
            cliente.subscribe(topicoSecreto);
            
            cliente.on('message', (topic, mensaje) => {
                const datos = JSON.parse(mensaje.toString());
                if (datos.accion === 'iniciar_juego') {
                    document.getElementById('espera').style.display = 'none';
                    document.getElementById('juego').style.display = 'block';
                    // Aquí llamarías a tu función para generar los círculos
                    // generarCirculo();
                }
            });
        }

        // Simulación de la función que se llama al tocar el último círculo
        function finalizarJuego() {
            const payload = JSON.stringify({ 
                accion: 'juego_terminado', 
                nombre: nombreUsuario 
            });
            
            // Enviar la notificación a la pantalla
            cliente.publish(topicoSecreto, payload);
            document.getElementById('juego').innerHTML = "¡Completado! Mira la pantalla.";
        }
    </script>
</body>
</html>
